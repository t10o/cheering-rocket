name: Test and Deploy Pipeline

# mainブランチへのプッシュ時にトリガー
on:
  push:
    branches: [main]
    paths:
      - "apps/app/**"
      - "packages/ui/**"
      - "packages/**"
      - ".github/workflows/**"
  workflow_dispatch: # 手動実行を可能にする

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync native versions
        run: pnpm --filter app run sync:version

      - name: Type check
        id: typecheck
        run: pnpm check-types

      - name: Lint check
        id: lint
        run: pnpm lint

      - name: Format check
        id: format
        run: pnpm format --check

      - name: Run tests
        id: tests
        run: pnpm test

      - name: Build all packages
        id: build
        run: pnpm build

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks Performed:" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.typecheck.conclusion == 'success' && '✅' || '❌' }} TypeScript type checking" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.lint.conclusion == 'success' && '✅' || '❌' }} ESLint code quality check" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.format.conclusion == 'success' && '✅' || '❌' }} Prettier format check" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.tests.conclusion == 'success' && '✅' || '❌' }} Vitest unit tests" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.build.conclusion == 'success' && '✅' || '❌' }} Build verification" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: test # testジョブが成功した場合のみ実行
    if: success() # testジョブが成功した場合のみ実行
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_SENDER_ID: ${{ secrets.VITE_FIREBASE_SENDER_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_CHEER_WEB_BASE_URL: ${{ secrets.VITE_CHEER_WEB_BASE_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI package
        run: pnpm --filter @cheering/ui build

      - name: Build web app
        run: pnpm --filter app build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x apps/app/android/gradlew

      - name: Sync Capacitor
        run: |
          cd apps/app
          pnpm exec cap sync android

      - name: Prepare Android keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          KEY_PATH="$HOME/.android/ci-upload.keystore"
          mkdir -p "$(dirname "$KEY_PATH")"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEY_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEY_PATH" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> $GITHUB_ENV

      - name: Build Android APK
        run: |
          cd apps/app/android
          if [ -n "${ANDROID_KEYSTORE_PATH}" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-distribution
          path: |
            apps/app/android/app/build/outputs/apk/release/app-release.apk
            apps/app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase App Distribution
        run: |
          cd apps/app/android
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi
          firebase appdistribution:distribute "$APK_PATH" --app ${{ secrets.FIREBASE_ANDROID_APP_ID }} --groups "runners" --release-notes "Build from commit ${{ github.sha }} - ${{ github.event.head_commit.message }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Summary
        if: always()
        run: |
          echo "## Deploy Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: Test success" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "- **APK**: Available in artifacts" >> $GITHUB_STEP_SUMMARY
            echo "- **Distribution**: Sent to Firebase App Distribution" >> $GITHUB_STEP_SUMMARY
          fi
