name: Firebase Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/firebase/**"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Firebase Resources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_PROJECT_ID: cheering-rocket-b3608

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Cloud Functions
        run: pnpm --filter @cheering/firebase-functions build

      - name: Deploy Firestore rules, indexes, Storage rules, and Functions
        working-directory: apps/firebase
        env:
          FIREBASE_TOKEN: ${{ env.FIREBASE_TOKEN }}
        run: pnpm exec firebase deploy --project $FIREBASE_PROJECT_ID --only functions,firestore:rules,firestore:indexes,storage --force

      - name: Deployment summary
        if: always()
        run: |
          echo "## Firebase Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Project: ${{ env.FIREBASE_PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
